name: Build Android APK
 
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
 
    steps:
      # 1. Checkout code
      - name: Checkout source
        uses: actions/checkout@v4
 
      # 2. Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
 
      # 3. Cai cac goi he thong
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            openjdk-17-jdk \
            build-essential ccache \
            libncurses5 libncurses5-dev \
            libffi-dev libssl-dev libbz2-dev zlib1g-dev \
            libsqlite3-dev libreadline-dev \
            autoconf automake libtool pkg-config
 
      # 4. Cai Android SDK thu cong (fix loi build-tools not found)
      - name: Install Android SDK
        run: |
          # Tai Android command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
 
          # Thiet lap bien moi truong
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
 
          # Accept tat ca license
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
 
          # Cai build-tools, platform-tools, platform
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;34.0.0" \
            "platform-tools" \
            "platforms;android-33"
 
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
 
      # 5. Cai Buildozer + Cython
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython
 
      # 6. Cache Buildozer (Android NDK, gradle, ...) de build lan sau nhanh hon
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-
 
      # 7. Thiet lap bien moi truong cho Buildozer biet duong dan SDK
      - name: Set Buildozer Android SDK path
        run: |
          mkdir -p ~/.buildozer/android/platform
          # Tao symlink de Buildozer tim thay SDK
          ln -sfn $HOME/android-sdk ~/.buildozer/android/platform/android-sdk
 
      # 8. Build APK
      - name: Build debug APK
        run: buildozer -v android debug
 
      # 9. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-APK
          path: bin/*.apk
          retention-days: 30
