name: Build Android APK
 
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
 
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
 
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
 
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            openjdk-17-jdk \
            build-essential ccache \
            libncurses5 libncurses5-dev \
            libffi-dev libssl-dev libbz2-dev zlib1g-dev \
            libsqlite3-dev libreadline-dev \
            autoconf automake libtool pkg-config
 
          # Dat Java 17 la mac dinh
          sudo update-java-alternatives -s java-1.17.0-openjdk-amd64 2>/dev/null || true
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "Using Java: $(java -version 2>&1 | head -1)"
 
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.36
 
      - name: Install Android SDK (dung sdkmanager tu Android Studio CLI tools)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
 
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools
 
          # Tai cmdline-tools phien ban co sdkmanager tai tools/bin/sdkmanager (tuong thich Buildozer)
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -O cmdtools.zip
          unzip -q cmdtools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
 
          # Tao symlink tools/bin/sdkmanager de Buildozer tim thay
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager
 
          export ANDROID_SDK_ROOT=$SDK_DIR
          export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools
 
          # Accept licenses
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager \
                --sdk_root=$SDK_DIR --licenses 2>/dev/null || true
 
          # Cai build-tools va platform
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$SDK_DIR \
            "build-tools;33.0.2" \
            "platform-tools" \
            "platforms;android-33"
 
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "$SDK_DIR/build-tools/33.0.2" >> $GITHUB_PATH
 
      - name: Cache Buildozer NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-ndk-r25b
          key: android-ndk-r25b
 
      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          buildozer -v android debug 2>&1
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-APK
          path: bin/*.apk
          retention-days: 30
