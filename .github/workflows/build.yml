name: Build Android APK
 
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # cho phep chay thu cong tu GitHub UI
 
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
 
    steps:
      # 1. Checkout code
      - name: Checkout source
        uses: actions/checkout@v4
 
      # 2. Python 3.10 (Buildozer khong on voi 3.12+)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
 
      # 3. Cai cac goi he thong can thiet
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential ccache libncurses5 \
            libffi-dev libssl-dev libbz2-dev zlib1g-dev \
            libsqlite3-dev libreadline-dev autoconf automake libtool
 
      # 4. Cai Buildozer + Cython
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython
 
      # 5. Cache Android SDK/NDK de lan build sau nhanh hon
      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-
 
      # 6. Build APK
      - name: Build debug APK
        run: buildozer -v android debug
 
      # 7. Upload APK de download
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-APK
          path: bin/*.apk
          retention-days: 30